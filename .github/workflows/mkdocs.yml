name: Deploy Docs
on:
  push:
    branches:
      - main
    paths:
      - 'Docs/**'
      - 'mkdocs.yml'
      - '.github/docs-requirements.txt'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install -r .github/docs-requirements.txt
      - name: Deploy
        run: mkdocs gh-deploy --force
