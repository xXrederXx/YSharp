name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore YSharp.sln
      - name: Check formatting
        run: dotnet format YSharp.sln --verify-no-changes
      - name: Build
        run: dotnet build YSharp.sln --configuration Release --no-restore
      - name: Test with coverage
        run: |
          pwd
          dotnet test tests/YSharp.Tests/YSharp.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults
      - name: Generate coverage badge JSON
        run: python .github/scripts/build_coverage_badge.py
      - name: Create Pull Request with coverage badge (main only)
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: Update coverage badge [skip ci]'
          title: 'chore: Update coverage badge'
          body: 'Automated coverage badge update'
          branch: coverage-badge-update
          delete-branch: true
